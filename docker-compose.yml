services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: executive_ai
      POSTGRES_USER: executive
      POSTGRES_PASSWORD: executive_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U executive -d executive_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://executive:executive_password@db:5432/executive_ai
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_ADMIN_API_KEY: ${ADMIN_API_KEY:-change-this-admin-key}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_ADMIN_API_KEY: ${ADMIN_API_KEY:-change-this-admin-key}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
